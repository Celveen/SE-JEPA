saved_folder: /data/zjc/adaJEPA/CL-JEPA/checkpoints/lewm_pushobj_T16k
img_size: 224
frameskip: 5
num_hist: 3
num_pred: 1
num_action_repeat: 1
model:
  _target_: models.lewm.LeWMWorldModel
  history_size: 3
  img_size: 224
  patch_size: 14
  embed_dim: 192
  pred_depth: 6
  pred_heads: 16
  pred_mlp_dim: 2048
  pred_dim_head: 64
  pred_dropout: 0.1
  proj_hidden_dim: 2048
  action_dim: 10
training:
  seed: 0
  epochs: 10
  batch_size: 128
  lr: 5.0e-05
  weight_decay: 0.001
  grad_clip: 1.0
  sigreg_weight: 0.09
  sigreg:
    knots: 17
    num_proj: 1024
  num_workers: 24
  log_every: 200
  val_batches: 100
  bn_batches: 200
env:
  name: pushobj
  args: []
  kwargs:
    with_velocity: true
    with_target: true
  dataset:
    _target_: datasets.pusht_dset.load_pusht_slice_train_val
    with_velocity: true
    n_rollout: null
    normalize_action: true
    data_path: /data/zjc/adaJEPA/CL-JEPA/data/pushobj_T16k_bias
    split_ratio: 0.9
    transform:
      _target_: datasets.img_transforms.default_transform
      img_size: 224
  decoder_path: null
