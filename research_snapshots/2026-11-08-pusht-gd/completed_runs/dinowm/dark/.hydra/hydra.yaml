hydra:
  run:
    dir: /data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/baselines/dinowm_pusht_random16k_e10_20261106/gd/dark
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/baselines/dinowm_pusht_random16k_e10_20261106/gd/dark
    - hydra.mode=RUN
    task:
    - ckpt_base_path=/data/zjc/adaJEPA/CL-JEPA/checkpoints/dinowm_pusht_random16k_orig_e3_20261106
    - model_epoch=3
    - n_evals=50
    - eval_data_path=/data/zjc/adaJEPA/experiment_plans/dinowm_random16k_original_e10_20261106/targets/pusht_T.pkl
    - seed=100
    - wandb_logging=false
    - planner.continual.tag=dark
    - audit.planner_kind=gd
    - audit.condition=dark
    - audit.pretraining_shape_status=seen
    - objective.mode=last
    - planner.n_taken_actions=25
    - planner.max_iter=6
    - audit.expected_physical_steps=25
    - audit.expected_replans=6
    - audit.expected_objective=last
    - planner.sub_planner.target=gd_microbatch.GDMicrobatchPlanner
    - planner.sub_planner.opt_steps=100
    - audit.expected_opt_steps=100
    - planner.sub_planner.lr=0.1
    - planner.sub_planner.sample_type=zero
    - planner.sub_planner.action_noise=0
    - +planner.sub_planner.microbatch_size=1
    - planner.sub_planner.cuda_graph=false
    - ood_corruption=dark
    - ood_level=0.9
  job:
    name: evaluate
    chdir: null
    override_dirname: +planner.sub_planner.microbatch_size=1,audit.condition=dark,audit.expected_objective=last,audit.expected_opt_steps=100,audit.expected_physical_steps=25,audit.expected_replans=6,audit.planner_kind=gd,audit.pretraining_shape_status=seen,ckpt_base_path=/data/zjc/adaJEPA/CL-JEPA/checkpoints/dinowm_pusht_random16k_orig_e3_20261106,eval_data_path=/data/zjc/adaJEPA/experiment_plans/dinowm_random16k_original_e10_20261106/targets/pusht_T.pkl,model_epoch=3,n_evals=50,objective.mode=last,ood_corruption=dark,ood_level=0.9,planner.continual.tag=dark,planner.max_iter=6,planner.n_taken_actions=25,planner.sub_planner.action_noise=0,planner.sub_planner.cuda_graph=false,planner.sub_planner.lr=0.1,planner.sub_planner.opt_steps=100,planner.sub_planner.sample_type=zero,planner.sub_planner.target=gd_microbatch.GDMicrobatchPlanner,seed=100,wandb_logging=false
    id: ???
    num: ???
    config_name: plan
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.1'
    cwd: /data/zjc/adaJEPA/experiment_plans/dinowm_random16k_original_e10_20261106/code
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/zjc/adaJEPA/experiment_plans/dinowm_random16k_original_e10_20261106/evaluation_dual/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/baselines/dinowm_pusht_random16k_e10_20261106/gd/dark
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
