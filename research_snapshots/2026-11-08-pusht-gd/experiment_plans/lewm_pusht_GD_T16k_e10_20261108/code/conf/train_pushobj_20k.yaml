# Architecture and optimization match checkpoints/pushobj_shape_shift/hydra.yaml.
# Data: data/pushobj_replay_20k (pusht_noise replay, 4 shapes x (4500 train + 500 val),
# start-state quality gate; scripts/gen_pushobj_dataset.py). 5 epochs as in the released
# pushobj_shape_shift/hydra.yaml (AdaJEPA App. A.2 reports 3).
# Multi-GPU: batch_size is the effective batch; train.py splits it across processes.
defaults:
  - train
  - override env: pusht
  - override encoder: scratch_resnet_gem
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: ${hydra:runtime.cwd}/checkpoints/pushobj_replay_20k_e5_seed0

env:
  name: pushobj
  dataset:
    data_path: ${hydra:runtime.cwd}/data/pushobj_replay_20k
  num_workers: 8

# The decoder only serves visualisation (its input is stop-gradient), so it is
# left out to save ~60% of the step time; checkpoints load with decoder=None and
# need decode_for_viz=false at planning time.
has_decoder: false
model:
  train_decoder: false

training:
  epochs: 5
  batch_size: 64
  straighten: cos1e-2
  save_every_x_iterations: 5000   # extra model_e{epoch}_it{i}.pth; epoch-end saves unchanged
  # Optional perceptual diagnostic only; does not enter the training loss.
  eval_lpips: false
