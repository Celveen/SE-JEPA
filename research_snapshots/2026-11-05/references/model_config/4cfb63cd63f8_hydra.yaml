# Training config of the released DDP-WM pusht model (stage 3, lrm). The checkpoint also carries the stage-1
# history fusion and localizer, so it is all that planning needs.
# Machine-specific paths and logging ids were removed; the dataset is read from $DATASET_DIR/pusht_noise.
ckpt_path: null
eval_only: false
eval_ckpt_path: null
training:
  seed: 0
  epochs: 2
  batch_size: 64
  save_every_x_epoch: 1
  encoder_lr: 1.0e-06
  predictor_lr: 0.0007
  action_encoder_lr: 0.0007
img_size: 224
frameskip: 5
concat_dim: 1
normalize_action: true
action_emb_dim: 10
num_action_repeat: 1
proprio_emb_dim: 10
num_proprio_repeat: 1
num_hist: 5
num_pred: 1
has_predictor: true
has_decoder: true
model:
  _target_: models.ddpwm.ddp_vwm.DDPVWorldModel
  image_size: 224
  num_hist: 3
  num_pred: 1
  train_encoder: false
  train_predictor: true
  training_stage: lrm
debug: false
env:
  name: pushobj  # evaluated in the pushobj env (T block), like our PushT column; trained in DINO-WM pusht
  args: []
  kwargs:
    with_velocity: true
    with_target: true
  dataset:
    _target_: datasets.pusht_dset.load_pusht_slice_train_val
    with_velocity: true
    n_rollout: null
    normalize_action: true
    data_path: /data/zjc/adaJEPA/CL-JEPA/data/pusht_noise
    split_ratio: 0.9
    transform:
      _target_: datasets.img_transforms.default_transform
      img_size: 224
  decoder_path: null
  num_workers: 6
motion:
  use_history: true
  mask_dilation: 0
  num_motion_tokens: 32
encoder:
  _target_: models.ddpwm.dino.DinoV2Encoder
  name: dinov2_vits14
  feature_key: x_norm_patchtokens
action_encoder:
  _target_: models.ddpwm.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
proprio_encoder:
  _target_: models.ddpwm.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
decoder:
  _target_: models.vqvae.VQVAE
  channel: 384
  n_embed: 2048
  n_res_block: 4
  n_res_channel: 128
  quantize: false
predictor:
  _target_: models.ddpwm.ddp_predictor.DDP_Predictor
effective_batch_size: 64
gpu_batch_size: 8
