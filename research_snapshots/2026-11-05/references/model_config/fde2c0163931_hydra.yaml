ckpt_base_path: ./checkpoints
training:
  seed: 0
  epochs: 3
  batch_size: 64
  save_every_x_epoch: 1
  save_every_x_iterations: 5000
  straighten: cos1e-2
  decoder_start_epoch: 3
  reconstruct_every_x_batch: 1000
  num_reconstruct_samples: 5
  encoder_lr: 1.0e-05
  decoder_lr: 0.0003
  predictor_lr: 0.0005
  action_encoder_lr: 0.0005
  stop_grad: true
  vcreg: false
  vcreg_apply_to: enc
  vcreg_std_coeff: 0
  vcreg_cov_coeff: 0
  mixed_precision: bf16
  eval_lpips: false
img_size: 224
frameskip: 5
concat_dim: 1
normalize_action: true
action_emb_dim: 10
num_action_repeat: 1
proprio_emb_dim: 10
num_proprio_repeat: 1
num_hist: 3
num_pred: 1
has_predictor: true
has_decoder: true
model:
  _target_: models.visual_world_model.VWorldModel
  image_size: 224
  num_hist: 3
  num_pred: 1
  train_encoder: true
  train_predictor: true
  train_decoder: true
plan_settings:
  plan_cfg_path: null
  planner:
  - gd
  - cem
  goal_source:
  - dset
  - random_state
  goal_H:
  - 5
  alpha:
  - 0.1
  - 1
debug: false
env:
  name: pushobj
  args: []
  kwargs:
    with_velocity: true
    with_target: true
  dataset:
    _target_: datasets.pusht_dset.load_pusht_slice_train_val
    with_velocity: true
    n_rollout: null
    normalize_action: true
    data_path: /home/appuser/workspace/project/multimodal-test/adajepa/data/pushobj_bias_16k
    split_ratio: 0.9
    transform:
      _target_: datasets.img_transforms.default_transform
      img_size: 224
  decoder_path: null
  num_workers: 8
encoder:
  _target_: models.encoder.resnet.SmallResNetGeM
  dim: 384
  gem_p: 3.0
action_encoder:
  _target_: models.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
proprio_encoder:
  _target_: models.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
decoder:
  _target_: models.vqvae.VQVAE
  channel: 384
  n_embed: 2048
  n_res_block: 4
  n_res_channel: 128
  quantize: false
predictor:
  _target_: models.vit.ViTPredictor
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0
  pool: mean
saved_folder: /home/appuser/workspace/project/multimodal-test/adajepa/checkpoints/pushobj_bias_16k_e3_seed0
effective_batch_size: 64
